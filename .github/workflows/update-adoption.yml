name: Update SDK adoption stats

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-adoption
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch npm + NuGet download stats
        run: python scripts/update_adoption.py

      - name: Commit if the numbers changed
        run: |
          if [[ -n "$(git status --porcelain _data/adoption.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/adoption.json
            git commit -m "chore: refresh npm/NuGet adoption stats"
            git push
            echo "Adoption stats updated and pushed."
          else
            echo "No change in adoption stats."
          fi
