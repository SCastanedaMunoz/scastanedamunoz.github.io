<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.author.name | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23211c17'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20font-weight='700'%20text-anchor='middle'%20fill='%23f0a63c'%3ES%3C/text%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.author.name | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/og.png' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#17130f; --surface:#211c17; --surface-2:#2a241e; --raise:#322a22;
      --line:rgba(233,184,119,.16); --line-strong:rgba(233,184,119,.34);
      --accent:#f0a63c; --accent-2:#e9b877; --accent-deep:#c2760a;
      --ink:#efe8de; --mut:#ab9f8e; --dim:#7c7264;
      --maxw:1180px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden}
    a{color:var(--accent); text-decoration:none}
    h1,h2,h3,h4{font-family:"Sora",sans-serif; line-height:1.15; font-weight:700; color:#fff}
    img{max-width:100%}
    .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,40px)}

    /* ---- nav ---- */
    .nav{position:sticky; top:0; z-index:50; background:rgba(23,19,15,.82); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line)}
    .nav .wrap{display:flex; align-items:center; justify-content:space-between; height:62px}
    .brand{font-family:"Sora"; font-weight:800; font-size:17px; color:#fff; letter-spacing:.3px}
    .brand b{color:var(--accent)}
    .nav .links{display:flex; gap:6px; align-items:center}
    .nav .links a{color:var(--mut); font-weight:500; font-size:14.5px; padding:8px 14px; border-radius:8px}
    .nav .links a:hover{color:var(--ink); background:var(--surface)}
    .nav .links a.active{color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent)}

    /* ---- hero ---- */
    .hero{position:relative; padding:clamp(48px,8vw,96px) 0 clamp(36px,5vw,60px);
      background:radial-gradient(1200px 500px at 78% -8%, rgba(240,166,60,.14), transparent 60%), var(--bg)}
    .hero .wrap{display:grid; grid-template-columns:1.55fr .9fr; gap:48px; align-items:center}
    .hero .eyebrow{color:var(--accent); font-weight:600; letter-spacing:2px; text-transform:uppercase; font-size:13px}
    .hero h1{font-size:clamp(34px,5vw,56px); font-weight:800; margin:14px 0 8px; letter-spacing:-.5px; overflow-wrap:break-word}
    .hero .role{font-size:clamp(17px,2vw,21px); color:var(--accent-2); font-family:"Sora"; font-weight:600}
    .hero p.pitch{color:var(--mut); font-size:16.5px; margin:18px 0 26px; max-width:56ch}
    .hero .cta{display:flex; flex-wrap:wrap; gap:12px}
    .portrait{justify-self:center; width:min(280px,72%); aspect-ratio:1; border-radius:22px; object-fit:cover;
      border:1px solid var(--line-strong); box-shadow:0 20px 50px rgba(0,0,0,.45)}
    .btn{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; padding:11px 18px; border-radius:10px; border:1px solid transparent; transition:.15s}
    .btn.primary{background:var(--accent); color:#241a0b}
    .btn.primary:hover{background:var(--accent-2)}
    .btn.ghost{border-color:var(--line-strong); color:var(--ink)}
    .btn.ghost:hover{background:var(--surface); border-color:var(--accent)}

    /* ---- sections ---- */
    section.block{padding:clamp(26px,3.6vw,48px) 0}
    .kicker{color:var(--accent); font-weight:600; letter-spacing:2px; text-transform:uppercase; font-size:12.5px; margin-bottom:8px}
    .block h2{font-size:clamp(24px,3.4vw,34px); font-weight:700; margin-bottom:6px}
    .block .sub{color:var(--mut); max-width:70ch; margin-bottom:26px}
    .alt{background:linear-gradient(180deg,var(--surface),transparent)}

    /* ---- stat row ---- */
    .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px}
    .stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 16px; text-align:center}
    .stat .n{font-family:"Sora"; font-weight:800; font-size:clamp(24px,3vw,32px); color:var(--accent)}
    .stat .l{color:var(--mut); font-size:12.5px; margin-top:4px; text-transform:uppercase; letter-spacing:.5px}

    /* ---- generic card grid ---- */
    .grid{display:grid; gap:18px}
    .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
    .g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;
      display:flex; flex-direction:column; transition:.16s}
    .card:hover{transform:translateY(-3px); border-color:var(--line-strong); box-shadow:0 14px 34px rgba(0,0,0,.4)}
    .card .body{padding:18px 20px 20px; display:flex; flex-direction:column; flex:1}
    .card h3{font-size:18px; margin-bottom:3px}
    .card .role{font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--accent-2); margin-bottom:9px; font-weight:600}
    .card p{color:var(--mut); font-size:14.5px; margin-bottom:14px}
    .card .thumb{width:100%; aspect-ratio:16/10; object-fit:cover; background:#0e0b08; display:block; border-bottom:1px solid var(--line)}
    .card .banner{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; font-size:3.4em}
    .card .btns{margin-top:auto; display:flex; flex-wrap:wrap; gap:8px}
    .lnkbtn{font-size:13px; font-weight:600; padding:6px 13px; border-radius:8px; border:1px solid var(--line-strong); color:var(--accent-2)}
    .lnkbtn:hover{background:color-mix(in srgb,var(--accent) 12%,transparent); border-color:var(--accent)}
    .lnkbtn.dead{color:var(--dim); border-color:var(--line); cursor:not-allowed}

    /* ---- tags ---- */
    .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
    .tags span{font-size:11.5px; background:color-mix(in srgb,var(--accent) 10%,transparent);
      border:1px solid var(--line); color:var(--accent-2); border-radius:6px; padding:2px 9px; white-space:nowrap}

    /* ---- experience timeline ---- */
    .tl{position:relative; max-width:900px}
    .tl .role-blk{border-left:2px solid var(--line-strong); padding:2px 0 30px 26px; position:relative}
    .tl .role-blk:last-child{padding-bottom:0}
    .tl .role-blk::before{content:""; position:absolute; left:-8px; top:5px; width:14px; height:14px; border-radius:50%;
      background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
    .tl h3{font-size:20px}
    .tl h3 .co{color:var(--accent)}
    .tl .meta{color:var(--dim); font-size:13px; margin:3px 0 12px; letter-spacing:.3px}
    .tl .meta .sep{margin:0 8px; opacity:.5}
    .tl ul{list-style:none; margin:10px 0 0}
    .tl ul li{position:relative; padding-left:20px; margin-bottom:8px; color:var(--ink)}
    .tl ul li::before{content:"›"; position:absolute; left:2px; top:-1px; color:var(--accent); font-weight:700; font-size:1.1em}
    .kw{color:#fff; font-weight:600}
    .titles{display:flex; flex-wrap:wrap; gap:20px; margin:16px 0 4px}
    .titles figure{width:104px; margin:0; text-align:center}
    .titles img{width:84px; height:84px; border-radius:18px; object-fit:cover; box-shadow:0 4px 14px rgba(0,0,0,.4)}
    .titles figcaption{font-size:12px; color:var(--mut); margin-top:6px; line-height:1.25}
    .trailers{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:16px}
    .trailers .v{position:relative; padding-bottom:56.25%; height:0; border-radius:10px; overflow:hidden; border:1px solid var(--line)}
    .trailers .v iframe{position:absolute; inset:0; width:100%; height:100%; border:0}

    /* ---- github stats ---- */
    .ghstats{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-top:8px}
    .ghstats img{height:150px; border-radius:12px; border:1px solid var(--line)}

    /* ---- footer ---- */
    footer.site{border-top:1px solid var(--line); background:var(--surface); margin-top:20px}
    footer.site .wrap{display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center; padding-top:26px; padding-bottom:26px}
    footer.site a{color:var(--mut); margin-right:18px; font-size:14px}
    footer.site a:hover{color:var(--accent)}
    footer.site .cr{color:var(--dim); font-size:13px}

    @media(max-width:760px){
      .nav .wrap{padding-left:16px; padding-right:16px}
      .brand{font-size:15px}
      .nav .links{gap:2px}
      .nav .links a{padding:7px 9px; font-size:13.5px}
      .hero .wrap{grid-template-columns:1fr; gap:26px; text-align:center}
      .hero h1{font-size:clamp(28px,7vw,40px)}
      .portrait{grid-row:1}
      .hero .cta{justify-content:center}
      .stats{grid-template-columns:repeat(2,1fr)}
      .hero .wrap > *{min-width:0}
      .grid > *{min-width:0}
      .hero p.pitch{max-width:100%}
      .nav .wrap{flex-wrap:wrap; height:auto; padding-top:10px; padding-bottom:10px; row-gap:6px}
    }

    /* ---- carousel ---- */
    .carousel{position:relative; max-width:820px; margin:18px 0}
    .carousel .viewport{overflow:hidden; border-radius:14px; border:1px solid var(--line); background:#0e0b08}
    .carousel .track{display:flex; transition:transform .38s ease}
    .carousel .track img{flex:0 0 100%; width:100%; aspect-ratio:16/10; object-fit:contain; background:#0e0b08; display:block}
    .carousel .cnav{position:absolute; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%;
      border:1px solid var(--line-strong); background:rgba(20,16,12,.72); color:var(--ink); font-size:22px; line-height:1;
      cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s}
    .carousel .cnav:hover{background:var(--accent); color:#241a0b; border-color:var(--accent)}
    .carousel .prev{left:10px} .carousel .next{right:10px}
    .carousel .dots{display:flex; gap:7px; justify-content:center; margin-top:12px; flex-wrap:wrap}
    .carousel .dots button{width:9px; height:9px; border-radius:50%; border:0; background:var(--line-strong); cursor:pointer; padding:0}
    .carousel .dots button.on{background:var(--accent)}
    .carousel .cap{text-align:center; color:var(--mut); font-size:13px; margin-top:8px; min-height:1.2em}
    .carousel .track img{cursor:zoom-in}
    .artgrid img{cursor:zoom-in}
    /* lightbox */
    .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.93); display:none; align-items:center; justify-content:center; padding:28px; z-index:200; cursor:zoom-out}
    .lightbox.open{display:flex}
    .lightbox img{max-width:96%; max-height:96%; border-radius:8px; box-shadow:0 12px 48px rgba(0,0,0,.6); background:#0e0b08}
    .lightbox .x{position:absolute; top:18px; right:24px; color:#fff; font-size:30px; line-height:1; opacity:.8}

    /* ---- game detail pages (shared) ---- */
    .gamehero{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
    .gamehero img.icon{width:104px; height:104px; border-radius:22px; object-fit:cover; border:1px solid var(--line-strong)}
    .back{color:var(--mut); font-size:14px}
    .prose{max-width:74ch}
    .prose p{color:var(--mut); margin-bottom:14px}
    .subh{font-size:16px; color:var(--accent); text-transform:uppercase; letter-spacing:1.2px; margin:26px 0 10px}
    .artgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:14px}
    .artgrid figure{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center}
    .artgrid img{width:100%; height:62px; object-fit:contain}
    .artgrid figcaption{font-size:11px; color:var(--mut); margin-top:5px}
    /* reusable subhead + timeline paragraph text */
    .section-subhead{font-size:15px; text-transform:uppercase; letter-spacing:1.4px; color:var(--accent); margin:34px 0 14px}
    .tl p{color:var(--mut)}

    /* reusable icon-led card header (icon + title/role) */
    .cardhead{display:flex; gap:14px; align-items:center; margin-bottom:12px}
    .cardhead img{width:58px; height:58px; border-radius:14px; flex:none; object-fit:cover; border:1px solid var(--line-strong)}
    .cardhead h3{margin:0}
    .cardhead .role{margin-top:3px}

    /* ---- articles / deep-dives ---- */
    .article{max-width:800px}
    .article .meta{color:var(--dim); font-size:13px; margin:4px 0 22px; letter-spacing:.3px}
    .article p{color:var(--mut); margin-bottom:15px}
    .article h3{font-size:18px; margin:28px 0 10px; color:#fff}
    .article ul{margin:0 0 15px; padding-left:20px; color:var(--mut)}
    .article ul li{margin-bottom:7px}
    .article code{background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:.9em; color:var(--accent-2)}
    .article pre{background:#0e0b08; border:1px solid var(--line); border-radius:10px; padding:16px 18px; overflow-x:auto; font-size:13px; color:var(--ink); margin:0 0 16px; line-height:1.5}
    .article pre code{background:none; border:0; padding:0; color:inherit}
    .mermaid{margin:20px 0; text-align:center}
    .mermaid svg{max-width:100%; height:auto}
    .callout{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px; margin:0 0 16px}
    .callout .n{font-family:"Sora",sans-serif; font-weight:800; color:var(--accent); font-size:1.4em}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Santiago<b>.</b>Castaneda</a>
      <div class="links">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="site">
    <div class="wrap">
      <div>
        <a href="https://github.com/SCastanedaMunoz" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/santiagocastanedamunoz/" rel="noopener">LinkedIn</a>
        <a href="mailto:santiagocm98@hotmail.com">Email</a>
      </div>
      <div class="cr">© {{ site.time | date: '%Y' }} Santiago Castaneda Munoz · Austin, TX</div>
    </div>
  </footer>
  <script>
    document.querySelectorAll('.carousel').forEach(function(c){
      var track=c.querySelector('.track'); if(!track) return;
      var slides=track.children, n=slides.length, i=0;
      var dots=c.querySelector('.dots'), cap=c.querySelector('.cap');
      function go(k){ i=(k+n)%n; track.style.transform='translateX(-'+(i*100)+'%)';
        if(dots) Array.prototype.forEach.call(dots.children,function(d,j){d.classList.toggle('on',j===i)});
        if(cap){ var a=slides[i].querySelector('img'); cap.textContent=a?(a.getAttribute('alt')||''):''; } }
      if(dots){ for(var k=0;k<n;k++){ (function(k){var b=document.createElement('button'); b.setAttribute('aria-label','Slide '+(k+1)); b.addEventListener('click',function(){go(k)}); dots.appendChild(b);})(k); } }
      var p=c.querySelector('.prev'), nx=c.querySelector('.next');
      if(p) p.addEventListener('click',function(){go(i-1)});
      if(nx) nx.addEventListener('click',function(){go(i+1)});
      go(0);
    });
    // lightbox — click any carousel or grid image to expand
    var lb=document.createElement('div'); lb.className='lightbox';
    var lbimg=document.createElement('img'); var lbx=document.createElement('span'); lbx.className='x'; lbx.textContent='×';
    lb.appendChild(lbimg); lb.appendChild(lbx); document.body.appendChild(lb);
    function closeLB(){ lb.classList.remove('open'); }
    lb.addEventListener('click', closeLB);
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLB(); });
    document.querySelectorAll('.carousel .track img, .artgrid img').forEach(function(im){
      im.addEventListener('click', function(e){ e.stopPropagation(); lbimg.src=im.currentSrc||im.src; lbimg.alt=im.alt||''; lb.classList.add('open'); });
    });
  </script>
  {% if page.mermaid %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad:true, theme:'base', securityLevel:'loose', flowchart:{curve:'basis',useMaxWidth:true},
      themeVariables:{ darkMode:true, background:'#17130f', primaryColor:'#2a241e', primaryTextColor:'#efe8de',
        primaryBorderColor:'#f0a63c', lineColor:'#c2760a', secondaryColor:'#241c14', tertiaryColor:'#1c1814',
        fontFamily:'Inter, sans-serif', fontSize:'14px', textColor:'#efe8de', mainBkg:'#2a241e',
        clusterBkg:'#1c1814', clusterBorder:'#3a2f24', nodeBorder:'#f0a63c', edgeLabelBackground:'#17130f', titleColor:'#f0a63c' } });
  </script>
  {% endif %}
</body>
</html>
